name: Docker Build & Verification

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'docker/**'
      - '.dockerignore'
      - 'requirements.txt'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Argus container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: argus:test
          load: true

      - name: Verify the image runs as a non-root user
        run: |
          user_id=$(docker run --rm --entrypoint id argus:test -u)
          echo "Container UID: $user_id"
          test "$user_id" = "10001"
