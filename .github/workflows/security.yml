name: Security Scan

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python Security (pip-audit & Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Scan dependencies with pip-audit
        run: |
          pip-audit -r requirements.txt --desc on

      - name: Static Application Security Testing (Bandit)
        run: |
          # Check high and medium severity security issues in backend
          bandit -r backend/ -ll -x backend/tests,backend/scripts

  frontend-security:
    name: Frontend Security (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm audit --audit-level=high
