name: CI

permissions:
  contents: read

# The repository had 44 passing tests and nothing that ran them. A test suite
# nobody executes is documentation, not a safety net.
#
# Deliberately split into fast and slow jobs: `lint` and `security` finish in
# under a minute and catch the majority of mistakes, so a broken PR fails fast
# rather than after a ten-minute torch install.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never sign with an ephemeral key - they assert on token validity
  # across calls. This value is for CI only and is not a real secret.
  ARGUS_JWT_SECRET: ci-only-test-secret-key-at-least-32-chars-long
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Byte-compile every module
        # Catches syntax errors in files no test imports - several modules in
        # this repo are only reachable at runtime.
        run: |
          python -m compileall -q backend tests

      - name: Check requirements files do not conflict
        # django was once declared in BOTH requirements files with different
        # ranges, which silently downgraded whichever installed last.
        run: |
          python - <<'PY'
          import re, sys
          def names(path):
              out = {}
              for line in open(path):
                  line = line.split("#")[0].strip()
                  if not line:
                      continue
                  name = re.split(r"[<>=!\[]", line)[0].strip().lower()
                  if name:
                      out[name] = line
              return out
          core = names("requirements.txt")
          opt = names("requirements-optional.txt")
          dupes = sorted(set(core) & set(opt))
          if dupes:
              for d in dupes:
                  print(f"::error::'{d}' declared in both requirements files: "
                        f"{core[d]!r} vs {opt[d]!r}")
              sys.exit(1)
          print(f"OK - {len(core)} core / {len(opt)} optional, no overlap")
          PY

      - name: Every declared dependency must be used
        # scikit-image (35 MB), statsmodels, torchmetrics, deap, black and
        # pylint were all declared but imported nowhere, inflating every
        # install and CI run. Catch that drift instead of rediscovering it.
        run: |
          python - <<'PY'
          import re, sys, pathlib
          # Packages that are legitimately not imported by our own source:
          # framework plugins, CLI tools, and runtime backends.
          INDIRECT = {
              "python-multipart",  # FastAPI Form()/UploadFile support
              "uvicorn",           # ASGI server, launched as a command
              "pytest-asyncio",    # pytest plugin, activated via pytest.ini
              "onnxruntime",       # inference backend loaded by name
              "torchvision",       # pulled in by ultralytics model loading
              "requests",          # Docker healthcheck / diagnostic scripts
              "pillow",            # torchvision ToPILImage(); hard dep of ultralytics
          }
          ALIASES = {
              "opencv-python-headless": "cv2", "pyyaml": "yaml",
              "pillow": "PIL", "scikit-learn": "sklearn",
              "pyjwt": "jwt", "paho-mqtt": "paho",
          }
          imported = set()
          for f in list(pathlib.Path("backend").rglob("*.py")) + \
                   list(pathlib.Path("tests").rglob("*.py")):
              for m in re.finditer(r"^\s*(?:import|from)\s+([A-Za-z0-9_]+)",
                                   f.read_text(errors="ignore"), re.M):
                  imported.add(m.group(1).lower())
          unused = []
          for line in open("requirements.txt"):
              line = line.split("#")[0].strip()
              if not line:
                  continue
              name = re.split(r"[<>=!\[]", line)[0].strip().lower()
              if name in INDIRECT:
                  continue
              module = ALIASES.get(name, name.replace("-", "_")).lower()
              if module not in imported:
                  unused.append(name)
          if unused:
              for u in unused:
                  print(f"::error::'{u}' is declared in requirements.txt but "
                        f"imported nowhere. Remove it, or add it to INDIRECT "
                        f"in this check with a reason.")
              sys.exit(1)
          print("OK - every declared dependency is imported or justified")
          PY

      - name: Perception layer must stay dependency-free
        # It is the schema every analyser writes into, so it has to import on a
        # machine with no GPU, no weights and no torch. A transitive ML import
        # is easy to add by accident and invisible in review.
        run: |
          python <<'PY'
          import ast, pathlib, sys

          stdlib = set(sys.stdlib_module_names)
          local = {"backend"}
          offenders = {}
          for path in sorted(pathlib.Path("backend/services/perception").glob("*.py")):
              roots = set()
              tree = ast.parse(path.read_text())
              # MODULE-LEVEL imports only. An import inside a function is lazy:
              # it runs when that feature is used, not when the package loads,
              # so it does not break importability on a machine without torch.
              # Optional backends (cv2 for colour, torch for the CUDA probe)
              # are deliberately deferred that way.
              for node in tree.body:
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          roots.add(a.name.split(".")[0])
                  elif isinstance(node, ast.ImportFrom):
                      if node.module and node.level == 0:
                          roots.add(node.module.split(".")[0])
              external = sorted(
                  r for r in roots
                  if r and not r.startswith("_") and r not in stdlib and r not in local
              )
              if external:
                  offenders[path.name] = external

          if offenders:
              for name, mods in offenders.items():
                  print(f"::error file=backend/services/perception/{name}::"
                        f"non-stdlib import(s): {', '.join(mods)}")
              sys.exit(1)
          print("perception layer imports only the standard library")
          PY

      - name: Validate YAML config and compose files
        run: |
          pip install pyyaml
          python - <<'PY'
          import yaml, sys
          for f in ("config/config.yaml", "docker-compose.yml",
                    "docker-compose.mediamtx.yml"):
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f"OK   {f}")
              except FileNotFoundError:
                  print(f"skip {f} (absent)")
              except Exception as exc:
                  print(f"::error file={f}::{exc}")
                  sys.exit(1)
          PY

  security:
    name: Secret & config hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: No plaintext secrets committed
        # config.yaml supports ${VAR} interpolation precisely so credentials
        # stay out of the repo. This asserts nobody has undone that.
        run: |
          python - <<'PY'
          import re, sys, pathlib
          HINTS = ("password", "passwd", "secret", "api_key", "apikey",
                   "token", "private_key", "access_key")
          # A value is suspicious unless it is empty, a ${VAR} placeholder,
          # an obvious placeholder word, or a comment.
          # Safe: empty, a ${VAR} placeholder (incl. ${VAR:-default} and
          # ${VAR:?error}), a number, a boolean, or an obvious placeholder word.
          SAFE = re.compile(r"^\s*(\$\{[^}]*\}|''|\"\"|null|~|true|false|"
                            r"[\d.]+|<[^>]+>|your[-_ ].*|change[-_ ]?me|"
                            r"xxx+|\.\.\.)?\s*$", re.I)
          bad = []
          for path in ["config/config.yaml", "docker-compose.yml", ".env.example"]:
              p = pathlib.Path(path)
              if not p.exists():
                  continue
              for n, line in enumerate(p.read_text().splitlines(), 1):
                  stripped = line.split("#")[0]
                  # Split on whichever separator appears FIRST. Splitting on ':'
                  # unconditionally mangles 'KEY=${VAR:?msg}' into a bogus value.
                  cands = [i for i in (stripped.find(":"), stripped.find("=")) if i != -1]
                  if not cands:
                      continue
                  sep = stripped[min(cands)]
                  key, _, value = stripped.partition(sep)
                  if any(h in key.lower() for h in HINTS) and not SAFE.match(value):
                      bad.append(f"{path}:{n}: {line.strip()}")
          if bad:
              for b in bad:
                  print(f"::error::possible plaintext secret -> {b}")
              sys.exit(1)
          print("OK - no plaintext secrets found")
          PY

      - name: .gitignore still excludes runtime data
        # data/ holds the database, snapshots and enrolled faces. A change that
        # starts tracking them leaks biometric data into git history.
        run: |
          set -e
          for path in data/argus.db data/snapshots/x.jpg backend/models/yolov8n.pt; do
            if git check-ignore -q "$path"; then
              echo "OK   $path ignored"
            else
              echo "::error::$path is NOT gitignored - runtime data would be committed"
              exit 1
            fi
          done
          # ...but the test fixture must stay tracked, or the suite cannot run.
          if git ls-files --error-unmatch data/demo_clip.mp4 > /dev/null 2>&1; then
            echo "OK   data/demo_clip.mp4 is tracked (tests depend on it)"
          else
            echo "::error::data/demo_clip.mp4 is not tracked - tests will fail on a fresh clone"
            exit 1
          fi

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the Docker image's version; 3.13 is what the sandbox runs.
        # The original pinned requirements were uninstallable on 3.13, so both
        # ends of the supported range are exercised.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        # CPU-only torch: the GPU wheels are ~2 GB and CI has no GPU.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fetch detection weights
        # backend/models/*.pt is gitignored (6 MB binary), so CI downloads it.
        run: |
          mkdir -p backend/models
          python - <<'PY'
          import shutil, pathlib, sys
          from ultralytics import YOLO
          dest = pathlib.Path("backend/models/yolov8n.pt")
          YOLO("yolov8n.pt")            # downloads if not already cached
          if not dest.exists():
              src = next((c for c in pathlib.Path(".").rglob("yolov8n.pt")
                          if c.resolve() != dest.resolve()), None)
              if src is None:
                  print("::error::yolov8n.pt was not found after download")
                  sys.exit(1)
              shutil.copy(src, dest)
          print("weights ready:", dest.stat().st_size, "bytes")
          PY

      - name: Initialise the database schema
        # Without Django's auth tables, 21 of the 22 security tests skip and CI
        # goes green having verified almost nothing.
        run: |
          python backend/scripts/init_db.py
          python backend/scripts/run_admin.py --setup-only

      - name: Run test suites
        run: |
          pytest tests/test_regression.py tests/test_api_security.py tests/test_security_hardening.py \
                 -v --tb=short --durations=10

      - name: Fail if too much was skipped
        # A suite that skips itself into a green tick is worse than a red one.
        run: |
          pytest tests/test_api_security.py -q 2>&1 | tee /tmp/sec.txt
          SKIPS=$(grep -oE '[0-9]+ skipped' /tmp/sec.txt | grep -oE '[0-9]+' || echo 0)
          echo "security suite skipped: ${SKIPS}"
          if [ "${SKIPS:-0}" -gt 2 ]; then
            echo "::error::${SKIPS} security tests skipped - the auth tables are probably missing"
            exit 1
          fi

      - name: Verify the API actually boots
        # The suites use TestClient. This catches lifespan/startup failures that
        # only appear when uvicorn runs the app for real.
        run: |
          python -m uvicorn backend.api.main:app --host 127.0.0.1 --port 8000 &
          SERVER=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "API is up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health | head -c 400; echo
          echo "--- unauthenticated request must be refused ---"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/cameras)
          echo "GET /api/v1/cameras -> $CODE"
          test "$CODE" = "401" || { echo "::error::expected 401, got $CODE"; kill $SERVER; exit 1; }
          echo "--- Prometheus metrics must be exposed ---"
          curl -sf http://127.0.0.1:8000/metrics | grep -q '^argus_' \
            || { echo "::error::/metrics returned no argus_ metrics"; kill $SERVER; exit 1; }
          kill $SERVER

  launcher:
    name: One-command launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The whole point of argus.py is that it behaves identically on every
        # desktop OS, so it has to be exercised on every desktop OS.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Oldest supported interpreter: catches 3.10+ only syntax slipping in.
          python-version: "3.9"

      - name: Launcher must be stdlib-only and importable
        # It runs BEFORE dependencies exist, so it may not import anything
        # third-party and must parse on the oldest supported Python.
        run: python -c "import ast,sys; ast.parse(open('argus.py').read()); print('parsed on', sys.version)"

      - name: doctor runs on a bare machine
        run: python argus.py doctor

      - name: stop is safe when nothing is running
        run: python argus.py stop

      - name: status is safe when nothing is running
        run: python argus.py status

      - name: Windows wrappers must keep CRLF endings
        shell: python
        run: |
          import sys
          bad = []
          for name in ("start.bat", "stop.bat"):
              data = open(name, "rb").read()
              if data.replace(b"\r\n", b"").count(b"\n"):
                  bad.append(name)
          if bad:
              print(f"::error::bare LF line endings in {bad} - cmd.exe will misparse them")
              sys.exit(1)
          print("start.bat and stop.bat use CRLF")

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        # Catches a missing import - App.jsx once imported a Login.jsx that had
        # never been committed, so a fresh clone could not build at all.
        run: |
          npm ci
          npm run build

      - name: Confirm build output exists
        run: |
          test -f frontend/dist/index.html \
            || { echo "::error::vite produced no index.html"; exit 1; }
          echo "Build output:"
          ls -la frontend/dist
