system:
  fps_target: 10
  max_cameras: 100
  snapshot_retention_days: 30
  log_level: INFO
  # ${ARGUS_DATA_DIR:-data} lets a hosting platform point all mutable state at
  # a mounted disk (Render/Fly persistent volume, Docker volume) without
  # editing this file. Defaults to ./data for a plain source checkout.
  snapshot_dir: ${ARGUS_DATA_DIR:-data}/snapshots

# Data Retention / Privacy
# Enforced by a background scheduler (backend/services/management/retention.py).
# Face embeddings are intentionally excluded: remove them explicitly via
# DELETE /api/v1/faces/{id} so recognition never breaks silently.
retention:
  enabled: true
  interval_hours: 6
  events_days: 90
  snapshots_days: 30
  anomalies_days: 30
  plates_days: 30
  audit_days: 365
  # Hard disk ceiling for the snapshot directory, enforced on every retention
  # pass by evicting the oldest files first. Time-based expiry alone cannot
  # bound disk usage inside the window. Set 0 to disable.
  snapshots_max_mb: 2048
  # Evidence clips. A 10 s 480p clip measures ~4 MB against ~200 KB for a
  # snapshot, so video needs a shorter window and its own ceiling.
  clips_days: 14
  clips_max_mb: 4096
  # Perception memory (Phase 6). Appearance descriptors are re-identifying and
  # expire quickly; the observations that cite them are text and are kept
  # longer for investigation.
  perception_observations_days: 60
  perception_appearances_days: 7

# Cross-Camera Tracking Configuration
cross_camera_tracker:
  enabled: true
  similarity_threshold: 0.5
  max_track_age_hours: 24
  max_path_points: 100
  enable_trajectory_prediction: true

inference:
  model: yolov8n.pt
  confidence_threshold: 0.5
  device: cpu
  classes: []  # Empty = detect all classes (person, car, animals, etc.)

# Image Enhancement Configuration
enhancement:
  enabled: true
  auto_enhance: true
  low_light_enhancement: true
  denoise: true
  sharpen: true
  night_vision: false
  deblur: true
  hdr: false

# Face Recognition Configuration
face_recognition:
  enabled: true
  confidence_threshold: 0.6
  model_path: models/face_recognition
  max_faces_per_frame: 10

# Speed Analysis Configuration
speed_analysis:
  enabled: true
  calibration_factor: 0.05
  reference_distance_m: 10.0

# Height Analysis Configuration
height_analysis:
  enabled: true
  avg_person_height_m: 1.7

mqtt:
  enabled: true
  broker: localhost
  port: 1883
  topic_prefix: argus
  qos: 1

database:
  # Same ${ARGUS_DATA_DIR} anchor as snapshot_dir: on an ephemeral container
  # filesystem the DB must live on the mounted disk or every restart wipes
  # users, cameras and events.
  url: sqlite:///${ARGUS_DATA_DIR:-data}/argus.db

# ── Mock Camera Definitions (for stream_simulator + API seeding) ──
cameras:
  - id: 1
    name: "Entrance Gate - Cam 1"
    rtsp_url: "rtsp://localhost:8554/cam1"
    location_tag: "site/perimeter/entrance"
    status: "offline"
    fps: 0
  - id: 2
    name: "Parking Lot - Cam 2"
    rtsp_url: "rtsp://localhost:8554/cam2"
    location_tag: "site/parking/lot_a"
    status: "offline"
    fps: 0
  - id: 3
    name: "Loading Dock - Cam 3"
    rtsp_url: "rtsp://localhost:8554/cam3"
    location_tag: "site/logistics/dock"
    status: "offline"
    fps: 0
  - id: 4
    name: "Rooftop Terrace - Cam 4"
    rtsp_url: "rtsp://localhost:8554/cam4"
    location_tag: "site/rooftop/terrace"
    status: "offline"
    fps: 0

# ── Default Virtual Zones ──
zones:
  - camera_id: 1
    name: "Restricted Entry"
    type: polygon
    coordinates: [[50, 50], [590, 50], [590, 430], [50, 430]]
  - camera_id: 2
    name: "VIP Parking"
    type: polygon
    coordinates: [[200, 100], [440, 100], [440, 300], [200, 300]]

# License Plate Recognition Configuration
license_plate:
  enabled: true
  region: us
  min_confidence: 0.6

# Anomaly Detection Configuration
anomaly:
  enabled: true
  sensitivity: 0.7
  window_size: 100

# Person Re-identification Configuration
reid:
  enabled: false
  similarity_threshold: 0.7
  feature_dim: 2048

# ── Consortium Attention Board Configuration ──
consortium:
  enabled: true
  sync_interval_ms: 100
  resource_bidding_enabled: true
  max_agents: 8
  bidding_strategy: proportional

# ── Real-Time Hardware Telemetry ──
telemetry:
  enabled: true
  sampling_interval_ms: 500
  cache_ttl_seconds: 1.0
  thresholds:
    cpu_warning: 0.80
    cpu_critical: 0.95
    gpu_warning: 0.75
    gpu_critical: 0.90
    ram_warning: 0.80
    ram_critical: 0.95
    vram_warning: 0.80
    vram_critical: 0.95
  stress_multiplier:
    min: 0.3
    max: 1.0
    curve_exponent: 2.0

# ── User Interaction & Viewport Attention Matrix ──
user_attention:
  enabled: true
  active_view_multiplier: 1.5
  click_interaction_boost: 2.0
  expanded_view_multiplier: 2.0
  click_boost_duration_s: 60
  decay_rate_seconds: 30
  viewport_poll_interval_s: 5
  unattended_camera_multiplier: 0.3

# ── Self-Referential Logic Mutation Engine ──
logic_mutation:
  enabled: true
  max_code_line_length: 15
  stability_threshold: 0.10
  max_variants: 20
  test_frame_count: 100
  allowed_builtin_overrides:
    - abs
    - min
    - max
    - round
    - sum
    - len
    - any
    - all
    - sorted
    - filter
    - map
  allowed_imports:
    - math
  sandbox_timeout_ms: 50

# ── Byzantine Fault-Tolerant State Recovery Manager ──
state_recovery:
  enabled: true
  heartbeat_timeout_ms: 2000
  max_allowed_consecutive_errors: 10
  ledger_history_limit: 5
  watchdog_poll_interval_ms: 500
  auto_rollback_enabled: true
  log_recovery_events: true

# ── YOLO Detection Agent ──
yolo_agent:
  enabled: true
  local_evolution:
    enabled: true
    evaluation_window: 1000
    mutation_rate: 0.1
  gene_vector_bounds:
    yolo_conf_threshold: [0.1, 0.9]
    iou_threshold: [0.1, 0.9]
    input_resolution_scale: [0.5, 1.0]
    tracker_matching_threshold: [0.4, 0.9]
  compute_cost_per_frame: 15.0

# ── Face Recognition Agent ──
face_agent:
  enabled: true
  local_evolution:
    enabled: true
    evaluation_window: 500
    mutation_rate: 0.12
  gene_vector_bounds:
    match_distance_threshold: [0.3, 0.9]
    min_face_size_px: [30, 100]
    track_timeout_seconds: [1.0, 10.0]
    frame_skip_cadence: [1, 10]
  compute_cost_per_frame: 8.5

# ── License Plate Recognition Agent ──
lpr_agent:
  enabled: true
  local_evolution:
    enabled: true
    evaluation_window: 500
    mutation_rate: 0.12
  gene_vector_bounds:
    segmentation_threshold: [0.3, 0.8]
    min_plate_height_px: [15, 50]
    resolution_downscale: [0.5, 1.0]
    detection_confidence: [0.4, 0.9]
    ocr_beam_width: [1, 5]
  compute_cost_per_frame: 12.0

# Generative-Evolutionary Cognition Engine Configuration
evolutionary_engine:
  enabled: true
  synthesizer:
    enabled: true
    context_window: 50
    min_generation_interval_s: 60
    max_generated_rules: 20
  evaluator:
    enabled: true
    evaluation_window: 1000
    fitness_weights:
      inference_speed: 0.3
      tracking_accuracy: 0.25
      false_positive_ratio: 0.2
      kafka_latency_ms: 0.1
      rule_precision: 0.15
    survival_threshold: 0.4
  mutation:
    enabled: true
    initial_mutation_rate: 0.1
    adaptive_rate: true
    max_mutation_attempts: 3
    population_cap: 50
    prune_interval_s: 300
    crossover_rate: 0.3
    vector_bounds:
      yolo_conf_threshold: [0.1, 0.9]
      iou_threshold: [0.1, 0.9]
      tracking_history_buffer: [5, 100]
      frame_skipping_cadence: [1, 5]
      rules_engine_cooldown: [0.5, 10.0]

# Deep Tracker Configuration
tracker:
  enabled: true
  algorithm: bytetrack
  track_buffer: 30
  match_threshold: 0.6

# Pose Estimation Configuration
pose:
  enabled: true
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

# Qdrant Vector Database Configuration
qdrant:
  enabled: true
  host: localhost
  port: 6333

# Kafka Configuration
kafka:
  enabled: false
  host: localhost
  port: 9092

# Rule configurations
rules:
  intrusion:
    enabled: true
    priority: high
    description: "Person/vehicle enters restricted zone"
  line_crossing:
    enabled: true
    priority: high
    description: "Object crosses a virtual tripwire (zone type 'line')"
  loitering:
    enabled: true
    threshold_seconds: 30
    priority: medium
    description: "Person remains in zone > 30 seconds"
  speed_violation:
    enabled: true
    threshold_kmh: 30
    # Requires per-camera ground-plane calibration (see camera_calibration
    # below). On an uncalibrated camera this rule reports itself inactive
    # rather than converting pixels to km/h with a guessed constant.
    violation_margin: 1.25   # must exceed threshold by 25% to absorb calib error
    classes: [car, truck, bus, motorcycle, bicycle]
    priority: high
    description: "Vehicle exceeds speed threshold"
  fall_detection:
    enabled: true
    # Requires real pose keypoints (MediaPipe). The bbox aspect-ratio fallback
    # cannot tell a fall from crouching, so require_keypoints stops a heuristic
    # being promoted to a high-priority medical alert.
    require_keypoints: true
    priority: high
    description: "Person fall detected via pose estimation"
  abandoned_object:
    enabled: true
    threshold_seconds: 60
    move_tolerance_px: 25      # movement under this counts as stationary
    owner_proximity_px: 150    # a person this close counts as the owner present
    classes: [backpack, handbag, suitcase, bottle, laptop]
    priority: medium
    description: "Stationary object unattended past the threshold"

# Pre-event video evidence.
#
# A snapshot shows the instant a rule fired; a clip shows the approach. Frames
# are buffered JPEG-encoded because raw 480p costs ~88 MB per camera for 10 s,
# which does not fit alongside the detection model on a small host.
evidence_clips:
  enabled: true
  pre_event_seconds: 10
  fps: 10
  jpeg_quality: 80
  # Hard per-camera memory ceiling. Enforced in bytes as well as frames,
  # because frame size varies ~40x with scene content.
  max_mb_per_camera: 24
  # Only these rules are worth a clip. Writing one costs a decode per frame
  # plus disk, so exporting for every scene_change would be waste.
  clip_rules:
    - intrusion
    - line_crossing
    - abandoned_object
    - fall_detection
    - speed_violation

# Alert delivery.
#
# Events are always recorded in the database. This section controls whether
# they are also *sent* anywhere. Until this existed, mqtt.enabled was true and
# nothing ever called the publisher, so every alert stayed in SQLite.
#
# Channel availability is probed at send time, never assumed from these flags:
# GET /api/v1/notifications/status reports what can actually deliver right now.
notifications:
  policy:
    # Only deliver events at or above this priority. Everything is still
    # recorded and queryable regardless.
    min_priority: medium
    # Empty allow list means "all rules". Deny wins over allow.
    rules_allow: []
    rules_deny: []
    # Per-rule quiet hours as [start_hour, end_hour], 24h clock. May wrap
    # midnight, e.g. [22, 6]. Use "*" to apply to every rule.
    #   quiet_hours:
    #     scene_change: [22, 6]
    quiet_hours: {}
    # Per (camera, rule) ceiling, so one flapping camera cannot exhaust a pager.
    rate_limit_per_minute: 20
  channels:
    mqtt:
      enabled: true
    webhook:
      enabled: false
      url: ""
      timeout_s: 5.0
      headers: {}

# Per-camera ground-plane calibration.
#
# Speed can only be reported for a camera listed here. Without an entry the
# camera is treated as uncalibrated and the speed_violation rule declines to
# fire, because pixel displacement times a guessed constant is not a
# measurement. Set meters_per_pixel directly, or give a reference object of
# known real width and its width in pixels and it will be derived.
#
# Example:
# camera_calibration:
#   "1":
#     meters_per_pixel: 0.0182
#     source: "measured: 3.5 m lane width spans 192 px at mid-frame"
#   "2":
#     reference_width_m: 1.8
#     reference_width_px: 96
#     source: "parked sedan width, mid-frame"
camera_calibration: {}
