version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: argus-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      # Required: a signing key of >=32 chars. Without it the app generates an
      # ephemeral key, so every container restart invalidates all issued tokens.
      # Set it in a .env file next to this compose file (see .env.example).
      - ARGUS_JWT_SECRET=${ARGUS_JWT_SECRET:?set ARGUS_JWT_SECRET in .env - see .env.example}
      - ARGUS_CORS_ORIGINS=${ARGUS_CORS_ORIGINS:-http://localhost:3000}
      - ARGUS_LOG_FORMAT=${ARGUS_LOG_FORMAT:-json}
      - ARGUS_LOG_LEVEL=${ARGUS_LOG_LEVEL:-INFO}
    depends_on:
      - mqtt
      - qdrant
    healthcheck:
      # Uses urllib from the stdlib rather than `requests`, and checks the exit
      # status. The previous probe imported requests (not a declared dependency)
      # and ignored the response code, so the container was reported unhealthy
      # even when the API was serving correctly.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: argus-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    container_name: argus-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  # Qdrant Vector Database for feature storage and similarity search
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: argus-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    command: >
      --storage
        caller_timeout=60
        raft_wal_delta_threshold=100
    restart: unless-stopped

  # Kafka for event streaming and analytics
  kafka:
    image: bitnami/kafka:3.7
    container_name: argus-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_PROCESS_ROLES=1
      - KAFKA_CFG_CONTROLLER_LISTENERS=CONTROLLER://:9093
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m
    volumes:
      - ./data/kafka:/bitnami/kafka
    restart: unless-stopped

volumes:
  data:
  config:
  mosquitto_data:
  mosquitto_log: