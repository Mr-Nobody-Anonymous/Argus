[pytest]
# Without this, `pytest` collects the legacy scripts in tests/ - several of
# them open sockets or never terminate (buffer_monitor.py loops forever).
# The two maintained suites are named explicitly.
testpaths = tests
python_files = test_*.py
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    slow: takes more than a few seconds (excluded with -m "not slow")
    integration: needs a running server or external service
# Keeps async tests working without a decorator on every coroutine.
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:google.protobuf.*
